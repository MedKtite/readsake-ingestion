# Readsake Ingestion standalone compose
# Connects to Postgres and MinIO running on the host / Docker network

services:
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: readsake-ingestion
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://readsake:Ktite%402030%25@host.docker.internal:5440/readsake}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
      S3_BUCKET: ${S3_BUCKET:-readsake-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
